<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>RAGnarok architecture</title>
<desc>Three tiers: an ingestion pipeline that turns any uploaded document into stored vectors, a query pipeline that answers questions with citations, and three interfaces (CLI, FastAPI, Streamlit) that all call the same underlying functions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
.th{font:500 14px sans-serif;} .ts{font:400 12px sans-serif;}
.teal-box{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;} .teal-title{fill:#085041;} .teal-sub{fill:#0F6E56;}
.purple-box{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5;} .purple-title{fill:#3C3489;} .purple-sub{fill:#534AB7;}
.coral-box{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5;} .coral-title{fill:#712B13;} .coral-sub{fill:#993C1D;}
.section{fill:#2C2C2A;} .conn{stroke:#888780;stroke-width:0.5;} .connlabel{fill:#5f5e5a;}
</style>

<text class="th section" x="40" y="50">Ingestion — any file, run once per upload</text>
<g><rect class="teal-box" x="40" y="65" width="130" height="56" rx="8"/><text class="th teal-title" x="105" y="83" text-anchor="middle" dominant-baseline="central">Upload</text><text class="ts teal-sub" x="105" y="101" text-anchor="middle" dominant-baseline="central">pdf docx html md txt</text></g>
<line x1="170" y1="93" x2="195" y2="93" class="conn" marker-end="url(#arrow)"/>
<g><rect class="teal-box" x="195" y="65" width="130" height="56" rx="8"/><text class="th teal-title" x="260" y="83" text-anchor="middle" dominant-baseline="central">Extract + chunk</text><text class="ts teal-sub" x="260" y="101" text-anchor="middle" dominant-baseline="central">1500 chars, page-aware</text></g>
<line x1="325" y1="93" x2="350" y2="93" class="conn" marker-end="url(#arrow)"/>
<g><rect class="teal-box" x="350" y="65" width="130" height="56" rx="8"/><text class="th teal-title" x="415" y="83" text-anchor="middle" dominant-baseline="central">Embed</text><text class="ts teal-sub" x="415" y="101" text-anchor="middle" dominant-baseline="central">OpenRouter API</text></g>
<line x1="480" y1="93" x2="505" y2="93" class="conn" marker-end="url(#arrow)"/>
<g><rect class="teal-box" x="505" y="65" width="130" height="56" rx="8"/><text class="th teal-title" x="570" y="83" text-anchor="middle" dominant-baseline="central">Store</text><text class="ts teal-sub" x="570" y="101" text-anchor="middle" dominant-baseline="central">chunks.json + .npy</text></g>

<path d="M570,121 L570,150 L260,150 L260,220" fill="none" class="conn" marker-end="url(#arrow)"/>
<text class="ts connlabel" x="415" y="140" text-anchor="middle">reads stored vectors</text>

<text class="th section" x="40" y="205">Query — every question</text>
<g><rect class="purple-box" x="40" y="220" width="130" height="56" rx="8"/><text class="th purple-title" x="105" y="238" text-anchor="middle" dominant-baseline="central">Embed query</text><text class="ts purple-sub" x="105" y="256" text-anchor="middle" dominant-baseline="central">same model</text></g>
<line x1="170" y1="248" x2="195" y2="248" class="conn" marker-end="url(#arrow)"/>
<g><rect class="purple-box" x="195" y="220" width="130" height="56" rx="8"/><text class="th purple-title" x="260" y="238" text-anchor="middle" dominant-baseline="central">Retrieve</text><text class="ts purple-sub" x="260" y="256" text-anchor="middle" dominant-baseline="central">cosine sim, top 5</text></g>
<line x1="325" y1="248" x2="350" y2="248" class="conn" marker-end="url(#arrow)"/>
<g><rect class="purple-box" x="350" y="220" width="130" height="56" rx="8"/><text class="th purple-title" x="415" y="238" text-anchor="middle" dominant-baseline="central">Build prompt</text><text class="ts purple-sub" x="415" y="256" text-anchor="middle" dominant-baseline="central">numbered + cited</text></g>
<line x1="480" y1="248" x2="505" y2="248" class="conn" marker-end="url(#arrow)"/>
<g><rect class="purple-box" x="505" y="220" width="130" height="56" rx="8"/><text class="th purple-title" x="570" y="238" text-anchor="middle" dominant-baseline="central">LLM answer</text><text class="ts purple-sub" x="570" y="256" text-anchor="middle" dominant-baseline="central">+ citation check</text></g>

<text class="th section" x="40" y="360">Three interfaces — same core underneath</text>
<g><rect class="coral-box" x="103" y="375" width="145" height="56" rx="8"/><text class="th coral-title" x="175" y="393" text-anchor="middle" dominant-baseline="central">CLI</text><text class="ts coral-sub" x="175" y="411" text-anchor="middle" dominant-baseline="central">query.py ingest.py</text></g>
<g><rect class="coral-box" x="268" y="375" width="145" height="56" rx="8"/><text class="th coral-title" x="340" y="393" text-anchor="middle" dominant-baseline="central">FastAPI</text><text class="ts coral-sub" x="340" y="411" text-anchor="middle" dominant-baseline="central">ask corpus health</text></g>
<g><rect class="coral-box" x="433" y="375" width="145" height="56" rx="8"/><text class="th coral-title" x="505" y="393" text-anchor="middle" dominant-baseline="central">Streamlit UI</text><text class="ts coral-sub" x="505" y="411" text-anchor="middle" dominant-baseline="central">upload + chat, deployed</text></g>
</svg>
